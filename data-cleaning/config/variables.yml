version: "0.1.0"
study_area: "Taihu Lake"
timezone: "Asia/Shanghai"
standard_crs: "EPSG:4326"

# required_level: A=core target/key, B=key driver, C=enhancement, D=out of first release
# source_type: observed, remote_sensing, derived, imputed, static
variables:
  - code: run_id
    name_zh: 流水线运行编号
    source_type: static
    data_type: string
    unit: null
    raw_frequency: run
    standard_frequency: run
    required_level: A
    role: provenance
    missing_policy: reject
    evidence: [E00]
  - code: source_id
    name_zh: 数据源编号
    source_type: static
    data_type: string
    unit: null
    raw_frequency: record
    standard_frequency: record
    required_level: A
    role: provenance
    missing_policy: reject
    evidence: [E00]
  - code: observed_at
    name_zh: 观测或过境时间
    source_type: observed
    data_type: datetime
    unit: ISO8601
    raw_frequency: source_defined
    standard_frequency: raw_hour_daily
    required_level: A
    role: key_time
    missing_policy: reject
    evidence: [E01]
  - code: station_id
    name_zh: 标准站点编号
    source_type: static
    data_type: string
    unit: null
    raw_frequency: station
    standard_frequency: station
    required_level: A
    role: key_space
    missing_policy: isolate
    evidence: [E02]
  - code: station_name
    name_zh: 站点名称
    source_type: static
    data_type: string
    unit: null
    raw_frequency: station
    standard_frequency: station
    required_level: B
    role: metadata
    missing_policy: station_master_lookup
    evidence: [E02]
  - code: lake_zone
    name_zh: 太湖分区
    source_type: static
    data_type: enum
    unit: null
    raw_frequency: station_or_grid
    standard_frequency: station_or_grid
    required_level: B
    role: spatial_heterogeneity
    missing_policy: derive_from_geometry
    evidence: [E02, E03]
  - code: longitude
    name_zh: 经度
    source_type: static
    data_type: float
    unit: degree_east
    raw_frequency: station_or_grid
    standard_frequency: station_or_grid
    required_level: A
    role: spatial_match
    allowed_range: [119.5, 121.0]
    missing_policy: reject_spatial_record
    evidence: [E01]
  - code: latitude
    name_zh: 纬度
    source_type: static
    data_type: float
    unit: degree_north
    raw_frequency: station_or_grid
    standard_frequency: station_or_grid
    required_level: A
    role: spatial_match
    allowed_range: [30.8, 31.7]
    missing_policy: reject_spatial_record
    evidence: [E01]
  - code: depth_m
    name_zh: 采样或传感器深度
    source_type: observed
    data_type: float
    unit: m
    raw_frequency: source_defined
    standard_frequency: raw_profile
    required_level: B
    role: vertical_state
    allowed_range: [0, 100]
    missing_policy: keep_unknown_depth_flag
    evidence: [E02, E04]
  - code: geometry_wkt
    name_zh: 站点或网格几何
    source_type: static
    data_type: string
    unit: WKT
    raw_frequency: station_or_grid
    standard_frequency: station_or_grid
    required_level: C
    role: spatial_index
    missing_policy: derive_from_coordinates
    evidence: [E01]
  - code: source_row
    name_zh: 来源行号或像元索引
    source_type: static
    data_type: string
    unit: null
    raw_frequency: record
    standard_frequency: record
    required_level: A
    role: provenance
    missing_policy: reject
    evidence: [E00]

  - code: chlorophyll_a
    name_zh: 叶绿素a浓度
    source_type: observed
    data_type: float
    unit: ug/L
    raw_frequency: monthly_quarterly_or_continuous
    standard_frequency: hourly_daily_overpass
    required_level: A
    role: target_and_calibration
    allowed_range: [0, 10000]
    missing_policy: no_label_imputation
    evidence: [E02, E03, E05]
  - code: algae_density
    name_zh: 藻细胞密度
    source_type: observed
    data_type: float
    unit: cells/L
    raw_frequency: survey
    standard_frequency: daily_overpass
    required_level: A
    role: target_and_calibration
    allowed_range: [0, 1.0e12]
    missing_policy: no_label_imputation
    evidence: [E02, E03]
  - code: cyanobacteria_biomass
    name_zh: 蓝藻生物量
    source_type: observed
    data_type: float
    unit: mg/L
    raw_frequency: survey
    standard_frequency: daily_overpass
    required_level: B
    role: mechanistic_state
    allowed_range: [0, 10000]
    missing_policy: proxy_with_origin_flag
    evidence: [E02, E03]
  - code: phytoplankton_biomass
    name_zh: 浮游植物总生物量
    source_type: observed
    data_type: float
    unit: mg/L
    raw_frequency: survey
    standard_frequency: daily_overpass
    required_level: C
    role: ecological_context
    allowed_range: [0, 10000]
    missing_policy: optional
    evidence: [E02]
  - code: bloom_flag
    name_zh: 水华发生标志
    source_type: remote_sensing
    data_type: boolean
    unit: null
    raw_frequency: overpass_or_survey
    standard_frequency: daily
    required_level: A
    role: classification_target
    missing_policy: derive_from_validated_classification
    evidence: [E03, E05]
  - code: bloom_area_km2
    name_zh: 水华面积
    source_type: remote_sensing
    data_type: float
    unit: km2
    raw_frequency: overpass_or_survey
    standard_frequency: daily
    required_level: A
    role: spatial_target
    allowed_range: [0, 2338]
    missing_policy: no_imputation_without_valid_pixel_mask
    evidence: [E03]
  - code: bloom_fraction
    name_zh: 有效湖面水华比例
    source_type: derived
    data_type: float
    unit: fraction
    raw_frequency: derived_scene
    standard_frequency: daily
    required_level: B
    role: spatial_target_normalization
    allowed_range: [0, 1]
    missing_policy: null_without_valid_area
    evidence: [E03]

  - code: water_temperature
    name_zh: 水温
    source_type: observed
    data_type: float
    unit: degC
    raw_frequency: minute_hour_monthly
    standard_frequency: hourly_daily
    required_level: A
    role: growth_temperature_limit
    allowed_range: [0, 45]
    missing_policy: short_gap_only
    evidence: [E02, E03, E04]
  - code: pH
    name_zh: 酸碱度
