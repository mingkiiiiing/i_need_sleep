    raw_frequency: hourly_monthly_quarterly
    standard_frequency: hourly_daily
    required_level: B
    role: ecological_state_and_qc
    allowed_range: [4, 12]
    missing_policy: short_gap_or_neighbor
    evidence: [E01, E02]
  - code: dissolved_oxygen
    name_zh: 溶解氧
    source_type: observed
    data_type: float
    unit: mg/L
    raw_frequency: hourly_monthly_quarterly
    standard_frequency: hourly_daily
    required_level: B
    role: oxygen_state_and_qc
    allowed_range: [0, 30]
    missing_policy: short_gap_only
    evidence: [E01, E02]
  - code: turbidity
