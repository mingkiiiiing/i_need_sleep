# 机理参数先验 (设计 §6 / §12 contract/mechanism_parameters.yaml)
# 拟合值 n>=n_min 时覆盖先验并分层收缩；n_samples 一律如实记录
version: "1.0"

water_temp:
  k1: 0.35          # 与气温的热交换速率 /day
  k2: 0.02          # 短波辐射加热 (degC per MJ m-2 d-1)
  k3: 0.15          # 风混合散热 (degC per m/s)
  k4: 0.10          # 水深调节
  t_min_c: 0.0
  t_max_c: 40.0
  max_daily_change_c: 3.0
  n_min: 12
  prior_strength: 5.0

weather:
  harmonics: 2
  ar_order: 1
  precip_markov: true
  spatial_deviation:
    air_temperature: {amp_c: 1.5, phi: 0.8}
    wind_speed: {amp_rel: 0.20, phi: 0.7}
    shortwave_radiation: {amp_rel: 0.15, phi: 0.7}
    precipitation: {amp_rel: 0.60, phi: 0.6}
  humidity:
    base_pct: 78
    temp_sensitivity_pct_per_c: 1.2
  cloud:
    wet_day_mean: 0.8
    dry_day_mean: 0.35
    phi: 0.6

hydrology:
  level_ar_phi: 0.85
  level_annual_amplitude_m: 0.35
  level_mean_m: 3.10
  rainfall_response_m_per_mm: 0.0004
  rainfall_response_lag_days: [1, 2, 3]
  rainfall_response_weights: [0.5, 0.3, 0.2]
  depth_from_level_coeff: 1.0

nutrients:
  # 外源面积负荷 g m-2 day-1（按季节乘子）；释放随温度 Arrhenius；弱恢复力防漂移
  # DG-005：负荷量级按太湖真实外源负荷校正（TN ~20-55 g m-2 yr-1，TP ~1-3 g m-2 yr-1）；
  # 旧值（TN 0.9-1.6、TP 0.06-0.12）高一个数量级，导致仿真 TN 38% 触 12.0 上界
  load_tp_g_m2_day: {winter: 0.004, spring: 0.006, summer: 0.008, autumn: 0.005}
  load_tn_g_m2_day: {winter: 0.08, spring: 0.12, summer: 0.15, autumn: 0.10}
  release_tp_per_day: 0.004
  release_tn_per_day: 0.030
  release_theta: 1.07
  settling_tp_per_day: 0.020
  settling_tn_per_day: 0.010
  outflow_frac_per_day: 0.010
  relax_strength_per_day: 0.05
  wet_day_load_multiplier: 2.0
  storm_load_multiplier: 3.0
  uptake_tp_ratio: 0.004      # mg P per mg biomass growth
  uptake_tn_ratio: 0.040
  nh4_frac_of_tn: 0.25
  po4_frac_of_tp: 0.45
  no3_frac_of_tn: 0.45
  no2_frac_of_tn: 0.03
  cod_mn_per_biomass: 4.0
  do:
    reaeration_per_day: 0.30
    photosynthetic_max_mg_l_day: 3.0
    respiration_per_day: 0.08
    sediment_per_day: 0.05
  ph:
    base: 7.9
    bloom_amplitude: 0.6
  turbidity:
    wind_resuspension_ntu: 12.0
    bloom_contribution_ntu: 8.0
  sdd_m_base: 0.45

algae:
  mu_max_per_day: 0.35
  KN_mg_l: 0.20            # TN 半饱和
  KP_mg_l: 0.02            # TP 半饱和
  Topt_c: 28.0
  sigma_t_c: 7.0
  Iopt_mj_m2_day: 14.0
  resp_per_day: 0.08
  mort_per_day: 0.03
  grazing_per_day: 0.02
  K_base_mg_l: 60.0        # 携带量（生物量 mg/L）
  K_zone_scale:
    TAIHU_ML: 1.3
    TAIHU_ZS: 1.2
    TAIHU_GH: 1.1
    TAIHU_XK: 1.0
    TAIHU_ET: 1.1
    TAIHU_CT: 0.9
    TAIHU_WT: 1.2
    TAIHU_ST: 1.2
  calm_wind_ms: 3.0
  aggregation_gain: 1.5
  cell_mass_ug_per_cell: 0.05
  composition_factor: 0.8
  pigment_ratio_base: 1.5      # chla(µg/L) per biomass(mg/L)·组成因子；DG-006 量纲修正（真实 ~1–3 µg/mg，旧值 0.005 量纲错误）
  non_cyano_chla_ug_l: 2.0     # DG-006：非蓝藻本底 chla 由 4.0 下调，避免基线主导压制季节信号
  eps_sigma_rel: 0.06
  n_min: 12
  prior_strength: 5.0

bloom:
  a0: -3.0
  a1: 0.9          # log surface biomass
  a2: 0.5          # 静风指数
  a3: 0.06         # 水温
  a4: 0.5          # 7日持续性
  a5: 0.3          # 岸边效应
  persistence_days: 7

transport:
  diffusion_m2_s: 1.0
  wind_drift_fraction: 0.02
  coriolis_deflection_deg: 15
  boundary_outflow_per_day: 0.03   # 边缘单元向区外损失（MVP 单区近似）

physical_bounds:
  water_temperature: [0.0, 40.0]
  total_phosphorus: [0.0, 2.0]
  total_nitrogen: [0.0, 12.0]
  ammonia_nitrogen: [0.0, 5.0]
  dissolved_oxygen: [0.0, 20.0]
  pH: [6.0, 9.5]
  chlorophyll_a: [0.0, 2000.0]
  phytoplankton_biomass: [0.0, 200.0]
  bloom_fraction: [0.0, 1.0]
  water_level: [2.0, 5.0]
  wind_speed: [0.0, 25.0]

obs:
  publish_delay_p50_h: 6
  publish_delay_p90_h: 24
  measurement_error_pct: {default: 10.0, chlorophyll_a: 20.0, phytoplankton_biomass: 25.0, total_phosphorus: 10.0, total_nitrogen: 10.0}
  detection_limits:
    total_phosphorus: 0.01
    total_nitrogen: 0.05
    ammonia_nitrogen: 0.02
    chlorophyll_a: 0.5
    phosphate_phosphorus: 0.005

remote_sensing:
  cloud_invalid_threshold: 0.70
  ndci: {base: 0.02, per_chla_ug: 0.0006, noise_sigma: 0.01}
  fai: {base: -0.005, per_chla_ug: 0.00012, noise_sigma: 0.008}
  mci: {base: 0.001, per_chla_ug: 0.0002, noise_sigma: 0.005}
  chla_retrieval_ug_l: {per_chla: 1.0, noise_sigma_rel: 0.35, bias: 0.85}
